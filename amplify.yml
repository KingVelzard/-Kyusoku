version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd React-Frontend/kyusoku-app
        - npm ci
    build:
      commands:
        - cd React-Frontend/kyusoku-app
        - npm run build
  artifacts:
    baseDirectory: React-Frontend/kyusoku-app/build
    files:
      - '**/*'
  cache:
    paths:
      - React-Frontend/kyusoku-app/node_modules/**/*
